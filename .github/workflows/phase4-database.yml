name: Phase 4 database security

on:
  push:
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start --exclude realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit
      - run: pnpm test:db
